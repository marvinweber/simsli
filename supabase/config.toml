# Simsli — Supabase project config
# https://supabase.com/docs/guides/local-development

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
port = 54324    # local email testing (magic links land here in dev)
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "5MiB"   # increase later when photo feature is added

[auth]
site_url = "simsli://auth"
additional_redirect_urls = [
  "simsli://auth",
  "https://simsli.app/auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true    # magic link requires this
enable_email_change_confirmation = true

# Auth methods: Magic Link + Email/Password
# No third-party OAuth providers
